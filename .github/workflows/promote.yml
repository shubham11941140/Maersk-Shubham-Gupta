# Deploy = point an environment tag at an already-tested image. Rollback = the same,
# with an older tag. Nothing is rebuilt, so what ships is exactly what CI tested.
#
#   Actions → Promote → Run workflow → image_tag: sha-<commit> | 1.2.0, environment: staging | production
#
# The target runtime (VM / ECS / Cloud Run / k8s) pulls `ghcr.io/<repo>:<environment>`.
# Configure the "production" GitHub Environment with required reviewers for a manual gate.

name: Promote

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image tag to deploy (e.g. sha-<40-char commit> or 1.2.0)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false   # never interrupt a deployment half-way

permissions:
  contents: read
  packages: write

jobs:
  promote:
    name: Promote ${{ inputs.image_tag }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET: ${{ inputs.environment }}
    steps:
      - name: Validate input
        run: |
          # inputs are passed via env (not interpolated into the script) and validated
          if ! [[ "$IMAGE_TAG" =~ ^(sha-[0-9a-f]{40}|[0-9]+\.[0-9]+(\.[0-9]+)?|main)$ ]]; then
            echo "::error::image_tag must be sha-<40 hex>, a semver version, or main"; exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the image exists (only CI-published images can be promoted)
        run: docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG"

      - name: Record what is currently deployed (rollback reference)
        run: |
          {
            echo "### Previously on \`$TARGET\`"
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$TARGET" 2>/dev/null | head -5 || echo "(nothing deployed yet)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Move environment tag
        run: docker buildx imagetools create --tag "$IMAGE:$TARGET" "$IMAGE:$IMAGE_TAG"

      - name: Summary
        run: |
          {
            echo "### \`$TARGET\` now points at \`$IMAGE_TAG\`"
            echo "Rollback: re-run this workflow with the previous tag shown above."
          } >> "$GITHUB_STEP_SUMMARY"
