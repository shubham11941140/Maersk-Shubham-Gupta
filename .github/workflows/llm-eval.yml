# Manual, paid evaluation of the GenAI assistant against the REAL OpenAI API.
# Regular CI never calls an LLM (tests use a scripted fake, so they are free and deterministic).
#
# Setup: Settings → Secrets and variables → Actions → New repository secret → OPENAI_API_KEY
# Run:   Actions → LLM eval → Run workflow

name: LLM eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model id"
        default: "gpt-5.6-luna"
        required: true
      reasoning_effort:
        description: "reasoning_effort (empty for non-reasoning models)"
        default: "low"
        required: false

permissions:
  contents: read

jobs:
  live-assistant-tests:
    name: Assistant vs real OpenAI (${{ inputs.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SCI_ASSISTANT_MODEL: ${{ inputs.model }}
      SCI_ASSISTANT_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Fail early if the secret is missing
        run: test -n "$OPENAI_API_KEY" || { echo "::error::Add the OPENAI_API_KEY repository secret"; exit 1; }
      # The fixture builds the warehouse and starts the real API; the tests ask the brief's questions.
      - name: pytest -m live_llm
        run: pytest -m live_llm -v --junitxml=junit-llm.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-eval
          path: |
            junit-llm.xml
            /tmp/pytest-of-*/**/assistant-*.jsonl
